name: Source checkout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checkout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '8'
      OPENBLAS_NUM_THREADS: '8'
      MKL_NUM_THREADS: '8'
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install source interfaces
        run: python -m pip install -e ".[automation]"
      - name: Check source contracts and portable tests
        run: python -B tools/CheckSourceCheckout.py --output outputs/ci/source-checkout.json
      - name: Check reading indexes and tracked links
        run: |
          python tools/BuildPublicationIndex.py --check
          python tools/BuildAgentCatalog.py --check
          python tools/CheckReaderLinks.py --output outputs/ci/reader-links.json
      - name: Check discovery and maintenance helpers
        run: |
          python -m unittest discover -s tests -p test_agent_catalog.py
          python -m unittest discover -s tests -p test_reader_links.py
          python -m unittest discover -s tests -p test_release_readiness.py

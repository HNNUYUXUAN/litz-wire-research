name: Source checkout

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checkout-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '8'
      OPENBLAS_NUM_THREADS: '8'
      MKL_NUM_THREADS: '8'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install source interfaces
        run: python -m pip install -e ".[automation]"
      - name: Check source contracts and portable tests
        run: python -B tools/CheckSourceCheckout.py --output outputs/ci/source-checkout.json
      - name: Check publication indexes
        run: python tools/BuildPublicationIndex.py --check
      - name: Check discovery catalog
        run: python tools/BuildAgentCatalog.py --check
      - name: Check tracked reader links
        run: python tools/CheckReaderLinks.py --output outputs/ci/reader-links.json
      - name: Test discovery catalog
        run: python -m unittest discover -s tests -p test_agent_catalog.py
      - name: Test reader link checks
        run: python -m unittest discover -s tests -p test_reader_links.py
      - name: Test release metadata checks
        run: python -m unittest discover -s tests -p test_release_readiness.py
      - name: Test future publication builds
        run: python -m unittest discover -s tests -p test_publication_index.py
      - name: Test public dataset restoration
        run: python -m unittest discover -s tests -p test_public_data.py
      - name: Test anonymous download verifier
        run: python -m unittest discover -s tests -p test_anonymous_release_assets.py

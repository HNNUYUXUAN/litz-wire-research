[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "litz-research"
version = "1.0.0rc3"
description = "Agent-driven reproducible modeling and simulation, with Litz-wire research cases"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Miao Yuxuan"}]
dependencies = ["mpmath==1.3.0", "psutil==7.2.2"]

[project.optional-dependencies]
reading = ["pypdf==6.1.1"]
figures = ["pypdf==6.1.1", "Pillow==11.3.0", "numpy==2.3.3", "matplotlib==3.10.6"]
documents = ["pypdf==6.1.1", "pypdfium2==4.30.0", "Pillow==11.3.0", "markdown-it-py==4.2.0", "mdit-py-plugins==0.5.0", "mdurl==0.1.2", "reportlab==4.4.3"]
audit = ["wolframclient==1.4.0", "pypdf==6.1.1"]
ansys = ["pyaedt==1.8.0", "numpy==2.3.3"]
automation = ["mcp==1.17.0", "bibtexparser==1.4.3"]

[project.urls]
Repository = "https://github.com/HNNUYUXUAN/litz-wire-research"
Documentation = "https://github.com/HNNUYUXUAN/litz-wire-research/blob/main/README.md"
Issues = "https://github.com/HNNUYUXUAN/litz-wire-research/issues"
Publications = "https://github.com/HNNUYUXUAN/litz-wire-research/tree/main/publications"

[project.scripts]
litz-research = "litz_research.cli:main"

[tool.setuptools.packages.find]
where = ["python"]
